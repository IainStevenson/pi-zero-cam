---
- name: Configure Pi Zero camera server
  hosts: pi_cameras
  gather_facts: no

  tasks:

  - name: Update apt cache
    apt:
      update_cache: yes

  - name: Install nala
    apt:
      name: nala
      state: present

  - name: Run nala fetch
    command: nala fetch --auto -y

  - name: Update system packages
    command: nala update

  - name: Install camera packages
    apt:
      name: rpicam-apps
      state: present

  - name: Enable camera interface
    command: raspi-config nonint do_camera 0

  - name: Create install directory
    file:
      path: /home/zero/mediamtx-install
      state: directory
      owner: zero
      group: zero

  - name: Download MediaMTX
    get_url:
      url: https://github.com/bluenviron/mediamtx/releases/download/v1.16.3/mediamtx_v1.16.3_linux_arm64.tar.gz
      dest: /home/zero/mediamtx-install/mediamtx.tar.gz

  - name: Extract MediaMTX
    unarchive:
      src: /home/zero/mediamtx-install/mediamtx.tar.gz
      dest: /home/zero/mediamtx-install/
      remote_src: yes

  - name: Install mediamtx binary
    copy:
      src: /home/zero/mediamtx-install/mediamtx
      dest: /usr/local/bin/mediamtx
      mode: '0755'
      remote_src: yes

  - name: Copy MediaMTX config
    copy:
      src: files/mediamtx.yml
      dest: /home/zero/mediamtx.yml
      owner: zero
      group: zero
      mode: '0644'

  - name: Install systemd service
    template:
      src: templates/pi-zero-cam-streaming.service.j2
      dest: /etc/systemd/system/pi-zero-cam-streaming.service
      mode: '0644'

  - name: Reload systemd
    systemd:
      daemon_reload: yes

  - name: Enable and start streaming service
    systemd:
      name: pi-zero-cam-streaming.service
      enabled: yes
      state: started